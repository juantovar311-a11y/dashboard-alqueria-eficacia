&lt;/div&gt;&lt;div class=&quot;city-warning&quot; id=&quot;cityWarning&quot;&gt;&lt;b&gt;Ciudad no está en la base actual.&lt;/b&gt; La estructura ya queda preparada: cuando el Excel incluya una columna llamada &lt;b&gt;CIUDAD&lt;/b&gt;, este filtro y su segmentación se activarán automáticamente. No se infiere ciudad desde la ruta para evitar datos incorrectos.&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;kpis&quot;&gt;
  &lt;div class=&quot;panel kpi navy&quot;&gt;&lt;label&gt;Registros visibles&lt;/label&gt;&lt;b id=&quot;kReg&quot;&gt;—&lt;/b&gt;&lt;span&gt;filas que cumplen los filtros&lt;/span&gt;&lt;/div&gt;

<script>
const tabs=[...document.querySelectorAll('.tab')];
const views={general:document.getElementById('view-general'),detail:document.getElementById('view-detail')};
function showTab(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===name));Object.entries(views).forEach(([k,v])=>v.classList.toggle('active',k===name));requestAnimationFrame(()=>resizeFrame(name));window.scrollTo({top:0,behavior:'smooth'})}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function resizeFrame(name){const f=document.getElementById(name==='general'?'frame-general':'frame-detail');try{const d=f.contentDocument;if(!d)return;f.style.height=Math.max(900,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+20+'px'}catch(e){}}
function watchFrame(f,name){f.addEventListener('load',()=>{resizeFrame(name);try{const d=f.contentDocument;const ro=new ResizeObserver(()=>resizeFrame(name));ro.observe(d.documentElement);if(d.body)ro.observe(d.body);setInterval(()=>resizeFrame(name),1500)}catch(e){}})}
watchFrame(document.getElementById('frame-general'),'general');watchFrame(document.getElementById('frame-detail'),'detail');
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='switch-tab')showTab(d.tab);if(d.type==='open-detail'){showTab('detail');setTimeout(()=>document.getElementById('frame-detail').contentWindow.postMessage({type:'select-detail',tipo:d.tipo,valor:d.valor},'*'),120)}});
</script>
