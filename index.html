const $=id=&gt;document.getElementById(id);const fmtN=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});const fmt1=new Intl.NumberFormat('es-CO',{maximumFractionDigits:1});let DATA=[],FILTERED=[];
const clean=v=&gt;(v??'').toString().trim();const canon=v=&gt;{const s=clean(v);return ['0','N/A','NA','NULL','NONE','NAN','#N/A'].includes(s.toUpperCase())?'':s};const esc=s=&gt;clean(s).replace(/[&amp;&lt;&gt;&quot;']/g,m=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#039;'}[m]));const unique=(arr,key)=&gt;[...new Set(arr.map(r=&gt;canon(r[key])).filter(Boolean))].sort((a,b)=&gt;a.localeCompare(b,'es'));const setVals=(el,vals)=&gt;[...el.options].forEach(o=&gt;o.selected=vals.includes(o.value));const vals=el=&gt;[...el.selectedOptions].map(o=&gt;o.value).filter(Boolean);const pct=n=&gt;Number.isFinite(n)?fmt1.format(n)+'%':'—';const safe=(a,b)=&gt;b?a/b:0;
function sanitize(r){return{region:canon(r.region),ciudad:canon(r.ciudad),ruta:canon(r.ruta),merc:canon(r.merc),sup:canon(r.sup),lider:canon(r.lider),canal:canon(r.canal),razon:canon(r.razon),cod:canon(r.cod),pdv:canon(r.pdv),formato:canon(r.formato),fecha:clean(r.fecha).slice(0,10),camp:canon(r.camp),tipo:canon(r.tipo),tipoImpl:canon(r.tipoImpl),obj:+r.obj||0,impl:+r.impl||0,cumple:canon(r.cumple)||'SIN DATO',causal:canon(r.causal)}}
function minDate(){return DATA.map(r=&gt;r.fecha).filter(Boolean).sort()[0]||''}function maxDate(){const a=DATA.map(r=&gt;r.fecha).filter(Boolean).sort();return a.at(-1)||''}
function criteria(exclude=''){const f={};for(const [id,key] of Object.entries({fRegion:'region',fCiudad:'ciudad',fRuta:'ruta'})){if(id!==exclude){const a=vals($(id));if(a.length)f[key]=a}}const d=$('fDesde').value,h=$('fHasta').value;if(d)f.desde=d;if(h)f.hasta=h;return f}

function fill(id,key,base){const el=$(id),old=vals(el),list=unique(base,key);if(key==='ciudad'&amp;&amp;!unique(DATA,'ciudad').length){el.innerHTML='&lt;option&gt;Sin columna CIUDAD en la base&lt;/option&gt;';el.disabled=true;return}el.disabled=false;el.innerHTML=list.map(v=&gt;`&lt;option value=&quot;${esc(v)}&quot;&gt;${esc(v)}&lt;/option&gt;`).join('');setVals(el,old.filter(v=&gt;list.includes(v)))}
function searchOptions(id,q){const el=$(id),selected=new Set(vals(el)),txt=clean(q).toLowerCase();[...el.options].forEach(o=&gt;o.hidden=!!txt&amp;&amp;!o.text.toLowerCase().includes(txt));[...el.options].forEach(o=&gt;{if(selected.has(o.value))o.hidden=false})}

function stats(a){let si=0,no=0,sd=0,obj=0,impl=0;const pdv=new Set(),ruta=new Set(),merc=new Set(),sup=new Set(),lider=new Set(),region=new Set(),city=new Set();a.forEach(r=&gt;{if(r.cumple==='SI')si++;else if(r.cumple==='NO')no++;else sd++;if(r.pdv)pdv.add(r.pdv);if(r.ruta)ruta.add(r.ruta);if(r.merc)merc.add(r.merc);if(r.sup)sup.add(r.sup);if(r.lider)lider.add(r.lider);if(r.region)region.add(r.region);if(r.ciudad)city.add(r.ciudad);obj+=r.obj;impl+=r.impl});return{n:a.length,si,no,sd,obj,impl,gap:Math.max(obj-impl,0),pdv:pdv.size,ruta:ruta.size,merc:merc.size,sup:sup.size,lider:lider.size,region:region.size,city:city.size,comp:safe(si,si+no)*100}}

async function load(manual=false){if(manual)$('loading').classList.remove('hide');try{const r=await fetch('/api/data?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const a=await r.json();if(!Array.isArray(a)||!a.length)throw new Error('Sin registros');DATA=a.map(sanitize);fillOptions();$('liveDot').className='dot live';$('liveText').textContent=`LIVE · ${fmtN.format(DATA.length)} registros · Base_Datos_Dashboard.xlsx`;$('lastUpdated').textContent='· '+new Date().toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});if(PENDING_SELECTION){applySelection(PENDING_SELECTION.tipo,PENDING_SELECTION.valor);PENDING_SELECTION=null}else applyQuery()}catch(e){console.error(e);$('liveDot').className='dot error';$('liveText').textContent='No fue posible leer /api/data';$('toast').textContent='Revisa /api/status';$('toast').classList.add('show')}finally{$('loading').classList.add('hide')}}
document.querySelectorAll('[data-mode]').forEach(b=&gt;b.onclick=()=&gt;setMode(b.dataset.mode));$('entitySearch').addEventListener('input',e=&gt;fillOptions(e.target.value));$('entitySelect').addEventListener('change',e=&gt;e.target.value&amp;&amp;selectRows(e.target.value));$('clearEntity').onclick=()=&gt;{$('entitySearch').value='';fillOptions();clearProfile()};$('refreshBtn').onclick=()=&gt;load(true);$('backGeneralBtn')?.addEventListener('click',()=&gt;parent.postMessage({type:'switch-tab',tab:'general'},'*'));document.addEventListener('click',e=&gt;{const a=e.target.closest('.detail-jump');if(!a)return;e.preventDefault();jumpTo(a.dataset.type,decodeURIComponent(a.dataset.value||''))});window.addEventListener('message',e=&gt;{if(!e.data||e.data.type!=='select-detail')return;const sel={tipo:e.data.tipo,valor:e.data.valor};if(DATA.length)applySelection(sel.tipo,sel.valor);else PENDING_SELECTION=sel});load(false);
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
" title="Explorador detallado"></iframe></section>
<script>
const tabs=[...document.querySelectorAll('.tab')];
const views={general:document.getElementById('view-general'),detail:document.getElementById('view-detail')};
function showTab(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===name));Object.entries(views).forEach(([k,v])=>v.classList.toggle('active',k===name));requestAnimationFrame(()=>resizeFrame(name));window.scrollTo({top:0,behavior:'smooth'})}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function resizeFrame(name){const f=document.getElementById(name==='general'?'frame-general':'frame-detail');try{const d=f.contentDocument;if(!d)return;f.style.height=Math.max(900,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+20+'px'}catch(e){}}
function watchFrame(f,name){f.addEventListener('load',()=>{resizeFrame(name);try{const d=f.contentDocument;const ro=new ResizeObserver(()=>resizeFrame(name));ro.observe(d.documentElement);if(d.body)ro.observe(d.body);setInterval(()=>resizeFrame(name),1500)}catch(e){}})}
watchFrame(document.getElementById('frame-general'),'general');watchFrame(document.getElementById('frame-detail'),'detail');
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='switch-tab')showTab(d.tab);if(d.type==='open-detail'){showTab('detail');setTimeout(()=>document.getElementById('frame-detail').contentWindow.postMessage({type:'select-detail',tipo:d.tipo,valor:d.valor},'*'),120)}});
</script>
