const $=id=&gt;document.getElementById(id);const fmtN=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});const fmt1=new Intl.NumberFormat('es-CO',{maximumFractionDigits:1});let DATA=[],FILTERED=[];

    const x=m.get(key);x.n++;x.obj+=r.obj||0;x.impl+=r.impl||0;if(r.pdv)x.pdvs.add(r.pdv);if(r.ruta)x.rutas.add(r.ruta);

function startMonth(iso){return iso?iso.slice(0,7)+'-01':''}
function popBounds(){const a=[];DATA.forEach(r=&gt;{if(r.execStart)a.push(r.execStart);if(r.execEnd)a.push(r.execEnd)});a.sort();return[a[0]||'',a.at(-1)||'']}
function setPopPeriod(from,to,preset='custom'){const [lo,hi]=popBounds();POP_FROM=from||lo;POP_TO=to||hi;if(POP_FROM&amp;&amp;POP_TO&amp;&amp;POP_FROM&gt;POP_TO){const x=POP_FROM;POP_FROM=POP_TO;POP_TO=x}$('popFrom').value=POP_FROM;$('popTo').value=POP_TO;$('popPeriodLabel').textContent=POP_FROM===POP_TO?`Corte: ${POP_FROM}`:`${POP_FROM||'Inicio'} → ${POP_TO||'Fin'}`;document.querySelectorAll('[data-pperiod]').forEach(b=&gt;b.classList.toggle('active',b.dataset.pperiod===preset));refresh(true)}
function setPopPreset(p){const [lo,hi]=popBounds();if(p==='last')setPopPeriod(hi,hi,'last');else if(p==='7')setPopPeriod(isoAddDays(hi,-6),hi,'7');else if(p==='month')setPopPeriod(startMonth(hi),hi,'month');else setPopPeriod(lo,hi,'all')}
function initPopDates(){const [lo,hi]=popBounds();$('popFrom').min=$('popTo').min=lo;$('popFrom').max=$('popTo').max=hi;POP_FROM=lo;POP_TO=hi;$('popFrom').value=lo;$('popTo').value=hi;$('popPeriodLabel').textContent=lo&amp;&amp;hi?`${lo} → ${hi}`:'Sin fechas de ejecución';$('popFrom').onchange=()=&gt;setPopPeriod($('popFrom').value,$('popTo').value,'custom');$('popTo').onchange=()=&gt;setPopPeriod($('popFrom').value,$('popTo').value,'custom');document.querySelectorAll('[data-pperiod]').forEach(b=&gt;b.onclick=()=&gt;setPopPreset(b.dataset.pperiod))}

function execStatus(r){
 const t=today();
 if(r.execEnd&amp;&amp;t&gt;r.execEnd)return'Vencida';
 if(r.execStart&amp;&amp;t&lt;r.execStart)return'Por iniciar';
 if(r.execOpen&amp;&amp;r.execStart&amp;&amp;t&gt;=r.execStart)return'En ejecución · fin existencia';
 if(r.execStart&amp;&amp;r.execEnd&amp;&amp;t&gt;=r.execStart&amp;&amp;t&lt;=r.execEnd)return'En ejecución';
 if(r.execStart&amp;&amp;!r.execEnd)return'En ejecución';
 return'Sin fecha';
}
function severity(r){
 const st=execStatus(r);
 if((r.shortage&gt;0&amp;&amp;(st.startsWith('En ejecución')||st==='Por iniciar'))||(st==='Vencida'&amp;&amp;r.balance&gt;0))return'critical';
 if(r.shortage&gt;0||r.balance&gt;0||(r.arrived&gt;0&amp;&amp;r.output&lt;=0))return'warn';
 return'ok';
}
function stats(a){
 const sets={campaign:new Set(),article:new Set(),region:new Set(),pop:new Set()};
 let assigned=0,arrived=0,output=0,balance=0,shortage=0,shortRows=0,expired=0,balanceRows=0,noOutput=0,critical=0;
 a.forEach(r=&gt;{['campaign','article','region','pop'].forEach(k=&gt;{if(r[k])sets[k].add(r[k])});assigned+=+r.assigned||0;arrived+=+r.arrived||0;output+=+r.output||0;balance+=+r.balance||0;shortage+=+r.shortage||0;if(r.shortage&gt;0)shortRows++;if(r.balance&gt;0)balanceRows++;if(execStatus(r)==='Vencida'&amp;&amp;r.balance&gt;0)expired++;if(r.arrived&gt;0&amp;&amp;r.output&lt;=0)noOutput++;if(severity(r)==='critical')critical++});
 return{campaign:sets.campaign.size,article:sets.article.size,region:sets.region.size,pop:sets.pop.size,assigned,arrived,output,balance,shortage,shortRows,expired,balanceRows,noOutput,critical,coverage:assigned?output/assigned*100:0,arrival:assigned?arrived/assigned*100:0,stockOut:arrived?output/arrived*100:0}
}
function criteria(exclude=''){
 const map={fMonth:'month',fCampaign:'campaign',fRegion:'regional',fArticle:'article',fPop:'pop',fStatus:'status'},o={};
 Object.entries(map).forEach(([id,k])=&gt;{if(id===exclude)return;const v=vals(id);if(v.length)o[k]=v});if(POP_FROM)o.dateFrom=POP_FROM;if(POP_TO)o.dateTo=POP_TO;return o;
}
function apply(arr,c){
 return arr.filter(r=&gt;{if(c.dateFrom||c.dateTo){const st=r.execStart||'';const en=r.execOpen?'9999-12-31':(r.execEnd||r.execStart||'');if(!st)return false;if(c.dateFrom&amp;&amp;en&lt;c.dateFrom)return false;if(c.dateTo&amp;&amp;st&gt;c.dateTo)return false}if(c.month&amp;&amp;!c.month.includes(r.month))return false;if(c.campaign&amp;&amp;!c.campaign.includes(r.campaign))return false;if(c.regional&amp;&amp;!c.regional.includes(r.regional))return false;if(c.article&amp;&amp;!c.article.includes(r.article))return false;if(c.pop&amp;&amp;!c.pop.includes(r.pop))return false;if(c.status&amp;&amp;!c.status.includes(execStatus(r)))return false;if(ONLY_CRITICAL&amp;&amp;severity(r)!=='critical')return false;return true})
}
function optionValues(base,key){
 if(key==='status')return [...new Set(base.map(execStatus))].filter(Boolean).sort();
 return unique(base,key);
}
function fill(id,key,base){
 const el=$(id),old=vals(id),list=optionValues(base,key);el.innerHTML=list.map(v=&gt;`&lt;option value=&quot;${esc(v)}&quot;&gt;${esc(v)}&lt;/option&gt;`).join('');[...el.options].forEach(o=&gt;o.selected=old.includes(o.value));
}
function updateOptions(){const map={fMonth:'month',fCampaign:'campaign',fRegion:'regional',fArticle:'article',fPop:'pop',fStatus:'status'};Object.entries(map).forEach(([id,k])=&gt;fill(id,k,apply(DATA,criteria(id))))}
function searchOptions(id,q){const t=clean(q).toLowerCase();[...$(id).options].forEach(o=&gt;o.hidden=!!t&amp;&amp;!o.text.toLowerCase().includes(t))}
function group(a,key){const m=new Map();a.forEach(r=&gt;{const k=clean(r[key])||'Sin dato';if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return [...m].map(([name,rows])=&gt;({name,rows,...stats(rows)}))}
function barsHtml(rows,value,label,cls=''){if(!rows.length)return'&lt;div class=&quot;empty&quot;&gt;Sin datos para mostrar.&lt;/div&gt;';const max=Math.max(...rows.map(value),1);return rows.map(x=&gt;`&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barname&quot; title=&quot;${esc(x.name)}&quot;&gt;${esc(x.name)}&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill ${cls}&quot; style=&quot;width:${Math.max(2,value(x)/max*100)}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barval&quot;&gt;${label(x)}&lt;/div&gt;&lt;/div&gt;`).join('')}
function badgeStatus(st){const cls=st==='Vencida'?'red':st==='Por iniciar'?'blue':st.startsWith('En ejecución')?'green':'amber';return `&lt;span class=&quot;badge ${cls}&quot;&gt;${esc(st)}&lt;/span&gt;`}
function render(){
 const s=stats(FILTERED);

 $('kCampaign').textContent=fmtN.format(s.campaign);$('kArticle').textContent=fmtN.format(s.article);$('kRegion').textContent=fmtN.format(s.region);$('kAssigned').textContent=fmtN.format(s.assigned);$('kArrived').textContent=fmtN.format(s.arrived);$('kOutput').textContent=fmtN.format(s.output);$('kBalance').textContent=fmtN.format(s.balance);$('kShortage').textContent=fmtN.format(s.shortage);$('kCoverage').textContent=pct(s.coverage);
 $('aShort').textContent=fmtN.format(s.shortRows);$('aExpired').textContent=fmtN.format(s.expired);$('aBalance').textContent=fmtN.format(s.balanceRows);$('aNoOutput').textContent=fmtN.format(s.noOutput);
 $('flowAssigned').textContent=fmtN.format(s.assigned);$('flowArrived').textContent=fmtN.format(s.arrived);$('flowOutput').textContent=fmtN.format(s.output);$('flowBalance').textContent=fmtN.format(s.balance);
 $('flowArrivalPct').textContent=`${pct(s.arrival)} del asignado`;$('flowOutputPct').textContent=`${pct(s.coverage)} del asignado`;$('flowBalancePct').textContent=`${pct(s.arrived?s.balance/s.arrived*100:0)} de lo recibido`;
 $('flowMeta').textContent=`Faltante: ${fmtN.format(s.shortage)}`;$('arrivalProgress').style.width=Math.min(100,s.arrival)+'%';$('outputProgress').style.width=Math.min(100,s.coverage)+'%';$('balanceProgress').style.width=Math.min(100,s.arrived?s.balance/s.arrived*100:0)+'%';
 const outShare=s.arrived?s.output/s.arrived*100:0,balShare=s.arrived?s.balance/s.arrived*100:0;$('stockDonut').style.background=`conic-gradient(var(--green) 0 ${Math.min(100,outShare)}%, var(--amber) ${Math.min(100,outShare)}% ${Math.min(100,outShare+balShare)}%, #e9eff2 ${Math.min(100,outShare+balShare)}% 100%)`;$('stockPct').textContent=pct(outShare);$('lgOutput').textContent=fmtN.format(s.output);$('lgBalance').textContent=fmtN.format(s.balance);$('lgShort').textContent=fmtN.format(s.shortage);
 const campaigns=group(FILTERED,'campaign').sort((a,b)=&gt;b.balance-a.balance);$('campaignBars').innerHTML=barsHtml(campaigns.slice(0,10),x=&gt;x.balance,x=&gt;fmtN.format(x.balance),'amber');

 $('monthTimeline').innerHTML=months.length?months.map(x=&gt;{const p=x.assigned?x.output/x.assigned*100:0;return `&lt;div class=&quot;month-card&quot;&gt;&lt;b&gt;${esc(x.name)}&lt;/b&gt;&lt;div&gt;&lt;span&gt;${fmtN.format(x.campaign)} campañas · ${fmtN.format(x.article)} artículos&lt;/span&gt;&lt;div class=&quot;mini&quot;&gt;&lt;i style=&quot;width:${Math.min(100,p)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;${pct(p)}&lt;/strong&gt;&lt;strong&gt;Saldo ${fmtN.format(x.balance)}&lt;/strong&gt;&lt;/div&gt;`}).join(''):'&lt;div class=&quot;empty&quot;&gt;Sin datos.&lt;/div&gt;';
 renderAlerts();renderSummary();renderTable();
}
function renderAlerts(){
 let arr=FILTERED.filter(r=&gt;severity(r)!=='ok').map(r=&gt;({r,sev:severity(r),score:(execStatus(r)==='Vencida'&amp;&amp;r.balance&gt;0?1000000:0)+(r.shortage||0)*10+(r.balance||0)})).sort((a,b)=&gt;b.score-a.score).slice(0,60);
 $('alertMeta').textContent=`${arr.length} visibles`;
 if(!arr.length){$('alertList').innerHTML='&lt;div class=&quot;empty&quot;&gt;No hay alertas con la selección actual.&lt;/div&gt;';return}
 $('alertList').innerHTML=arr.map(({r,sev})=&gt;{const st=execStatus(r),issues=[];if(r.shortage&gt;0)issues.push(`faltan ${fmtN.format(r.shortage)} u. por recibir`);if(st==='Vencida'&amp;&amp;r.balance&gt;0)issues.push(`ejecución vencida con saldo ${fmtN.format(r.balance)}`);else if(r.balance&gt;0)issues.push(`saldo ${fmtN.format(r.balance)}`);if(r.arrived&gt;0&amp;&amp;r.output&lt;=0)issues.push('material recibido sin salida');return `&lt;div class=&quot;alert-item ${sev}&quot;&gt;&lt;div class=&quot;alert-icon&quot;&gt;${sev==='critical'?'⚠️':'📦'}&lt;/div&gt;&lt;div class=&quot;alert-main&quot;&gt;&lt;b&gt;${esc(r.pop||r.article||'Material POP')}&lt;/b&gt;&lt;p&gt;${esc(r.campaign)} · ${esc(r.regional)} · ${esc(r.executionRaw||'Sin fecha')}&lt;br&gt;${esc(issues.join(' · '))}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;alert-tag&quot;&gt;${sev==='critical'?'PRIORIDAD':'SEGUIMIENTO'}&lt;/span&gt;&lt;/div&gt;`}).join('')

function renderSummary(){

 $('summaryMeta').textContent=`${a.length} materiales`;

}
function renderTable(){

}

 const map={fMonth:'month',fCampaign:'campaign',fRegion:'regional',fArticle:'article',fPop:'pop',fStatus:'status'};Object.entries(map).forEach(([id,k])=&gt;fill(id,k,DATA));
 document.querySelectorAll('[data-search]').forEach(i=&gt;i.addEventListener('input',()=&gt;searchOptions(i.dataset.search,i.value)));

 Object.keys(map).forEach(id=&gt;$(id).addEventListener('change',()=&gt;refresh(true)));

 }catch(e){console.error(e);$('liveDot').className='dot error';$('liveText').textContent='No fue posible leer /api/pop';$('heroText').textContent='Revisa que Material_POP_Campanas.xlsx esté en GitHub y que el servidor actualizado esté desplegado.'}

<script>
const tabs=[...document.querySelectorAll('.tab')];
const views={general:document.getElementById('view-general'),detail:document.getElementById('view-detail'),pop:document.getElementById('view-pop')};
function showTab(name){
  tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  Object.entries(views).forEach(([k,v])=>v.classList.toggle('active',k===name));
  requestAnimationFrame(()=>resizeFrame(name));
  window.scrollTo({top:0,behavior:'smooth'});
}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function resizeFrame(name){
  const f=document.getElementById(name==='general'?'frame-general':name==='detail'?'frame-detail':'frame-pop');
  try{const d=f.contentDocument;if(!d)return;f.style.height=Math.max(900,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+20+'px'}catch(e){}
}
function watchFrame(f,name){
  f.addEventListener('load',()=>{
    resizeFrame(name);
    try{const d=f.contentDocument;const ro=new ResizeObserver(()=>resizeFrame(name));ro.observe(d.documentElement);if(d.body)ro.observe(d.body);setInterval(()=>resizeFrame(name),1500)}catch(e){}
  });
}
watchFrame(document.getElementById('frame-general'),'general');
watchFrame(document.getElementById('frame-detail'),'detail');
watchFrame(document.getElementById('frame-pop'),'pop');
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='switch-tab')showTab(d.tab);
  if(d.type==='open-detail'){
    showTab('detail');
    setTimeout(()=>document.getElementById('frame-detail').contentWindow.postMessage({type:'select-detail',tipo:d.tipo,valor:d.valor},'*'),120);
  }
});
</script>
